
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2030新春倒计时</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700&display=swap');
        .chinese-font { font-family: 'Ma Shan Zheng', cursive; }
        .gradient-bg { background: linear-gradient(135deg, #dc2626 0%, #f97316 50%, #fbbf24 100%); }
        .firework { 
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: firework-animation 1.5s ease-out forwards;
        }
        @keyframes firework-animation {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }
        .countdown-item {
            transition: all 0.3s ease;
        }
        .countdown-item:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.3);
        }
        .lantern {
            animation: swing 3s ease-in-out infinite alternate;
        }
        @keyframes swing {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex flex-col items-center justify-center p-4">
    <!-- 导航栏 -->
    <nav class="w-full max-w-6xl mb-8">
        <div class="flex justify-between items-center text-white">
            <h1 class="text-2xl chinese-font"><i class="fas fa-dragon mr-2"></i>新春吉祥</h1>
            <div class="flex space-x-4">
                <button class="hover:text-yellow-200 transition-colors"><i class="fas fa-home mr-1"></i>首页</button>
                <button class="hover:text-yellow-200 transition-colors"><i class="fas fa-info-circle mr-1"></i>关于</button>
                <button class="hover:text-yellow-200 transition-colors"><i class="fas fa-cog mr-1"></i>设置</button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="flex-1 w-full max-w-6xl">
        <div class="text-center mb-12">
            <div class="relative inline-block mb-8">
                <i class="fas fa-lantern lantern text-yellow-300 text-4xl absolute -left-12 top-2"></i>
                <h2 class="chinese-font text-5xl md:text-6xl text-white font-bold drop-shadow-lg">2030年春节倒计时</h2>
                <i class="fas fa-lantern lantern text-yellow-300 text-4xl absolute -right-12 top-2"></i>
            </div>
            <p class="text-yellow-100 text-lg md:text-xl mb-8">距离2030年农历新年还有</p>
            
            <!-- 倒计时显示 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12 max-w-2xl mx-auto">
                <div class="countdown-item bg-white/20 backdrop-blur-lg rounded-2xl p-6 border-2 border-yellow-300/30">
                    <div id="days" class="text-4xl md:text-5xl font-bold text-white">00</div>
                    <div class="text-yellow-200 mt-2">天</div>
                </div>
                <div class="countdown-item bg-white/20 backdrop-blur-lg rounded-2xl p-6 border-2 border-yellow-300/30">
                    <div id="hours" class="text-4xl md:text-5xl font-bold text-white">00</div>
                    <div class="text-yellow-200 mt-2">时</div>
                </div>
                <div class="countdown-item bg-white/20 backdrop-blur-lg rounded-2xl p-6 border-2 border-yellow-300/30">
                    <div id="minutes" class="text-4xl md:text-5xl font-bold text-white">00</div>
                    <div class="text-yellow-200 mt-2">分</div>
                </div>
                <div class="countdown-item bg-white/20 backdrop-blur-lg rounded-2xl p-6 border-2 border-yellow-300/30">
                    <div id="seconds" class="text-4xl md:text-5xl font-bold text-white">00</div>
                    <div class="text-yellow-200 mt-2">秒</div>
                </div>
            </div>

            <!-- 节日信息 -->
            <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-8 max-w-2xl mx-auto border-2 border-white/20">
                <h3 class="chinese-font text-2xl text-yellow-300 mb-4">春节信息</h3>
                <div class="grid md:grid-cols-2 gap-6 text-white text-left">
                    <div>
                        <p><i class="fas fa-calendar-day text-yellow-300 mr-2"></i><strong>春节日期：</strong>2030年2月3日</p>
                        <p><i class="fas fa-calendar-alt text-yellow-300 mr-2"></i><strong>农历：</strong>庚戌年 正月初一</p>
                    </div>
                    <div>
                        <p><i class="fas fa-dragon text-yellow-300 mr-2"></i><strong>生肖：</strong>狗年</p>
                        <p><i class="fas fa-moon text-yellow-300 mr-2"></i><strong>除夕：</strong>2030年2月2日</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="w-full max-w-6xl mt-12 text-center text-white/80">
        <div class="border-t border-white/20 pt-4">
            <p>© 2025-2030 新春倒计时 | 设计制作</p>
            <div class="flex justify-center space-x-4 mt-2">
                <button class="hover:text-yellow-200 transition-colors"><i class="fab fa-weixin"></i></button>
                <button class="hover:text-yellow-200 transition-colors"><i class="fab fa-weibo"></i></button>
                <button class="hover:text-yellow-200 transition-colors"><i class="fab fa-qq"></i></button>
            </div>
        </div>
    </footer>

    <script>
        // 倒计时计算函数
        function updateCountdown() {
            const springFestival2030 = new Date('2030-02-03T00:00:00+08:00');
            const now = new Date();
            const diff = springFestival2030 - now;

            if (diff <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');

            // 节日特效
            if (seconds % 10 === 0) {
                createFirework();
            }
        }

        // 创建烟花特效
        function createFirework() {
            const colors = ['#ff0000', '#ff9900', '#ffff00', '#00ff00', '#00ffff', '#ff00ff'];
            for (let i = 0; i < 30; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                firework.style.left = '50%';
                firework.style.top = '50%';
                firework.style.setProperty('--tx', `${(Math.random() - 0.5) * 200}px`);
                firework.style.setProperty('--ty', `${(Math.random() - 0.5) * 200}px`);
                document.body.appendChild(firework);
                
                setTimeout(() => {
                    firework.remove();
                }, 1500);
            }
        }

        // 初始化倒计时
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 添加一些初始烟花效果
            for (let i = 0; i < 5; i++) {
                setTimeout(createFirework, i * 300);
            }
        });
    </script>
</body>
</html>
